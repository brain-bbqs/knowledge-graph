<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BRAIN BBQS Knowledge Graph</title>
<meta name="description" content="Browse the BRAIN BBQS knowledge graph as a simple, expandable directory tree." />
<style>
  :root{
    --bg:#0f1115; --panel:#151922; --line:#242a36; --text:#e6e9ef; --dim:#98a1b3;
    --accent:#6ea8fe; --hit:#ffd479;
    --Consortium:#f4a261; --WorkingGroup:#6ea8fe; --Project:#7ee0a8; --MonetaryGrant:#c792ea;
    --Person:#ffd479; --Product:#59d1d6; --Announcement:#f28b82; --Event:#b0bec5; --Other:#8892a6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
  .stats{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--text);
       padding:7px 10px;border-radius:6px;min-width:220px;font:inherit;font-size:13px}
  input[type=search]:focus{outline:none;border-color:var(--accent)}
  button.tool{background:var(--panel);border:1px solid var(--line);color:var(--dim);
       padding:7px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:12px}
  button.tool:hover{color:var(--text);border-color:var(--accent)}
  main{display:flex;height:calc(100% - 56px);min-height:0}
  #tree{flex:1;overflow:auto;padding:14px 10px 60px}
  #side{width:340px;border-left:1px solid var(--line);overflow:auto;padding:16px;background:var(--panel)}
  @media (max-width:860px){ main{flex-direction:column} #side{width:auto;border-left:0;border-top:1px solid var(--line);max-height:45%} }

  .row{display:flex;align-items:center;gap:6px;padding:2px 6px;border-radius:5px;cursor:pointer;white-space:nowrap}
  .row:hover{background:#1c2230}
  .row.sel{background:#22304a}
  .row.hit .name{color:var(--hit)}
  .row.faded{opacity:.28}
  .twisty{width:14px;color:var(--dim);flex:0 0 14px;text-align:center}
  .icon{color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:2px;flex:0 0 8px;display:inline-block}
  .name{overflow:hidden;text-overflow:ellipsis}
  .kind{color:var(--dim);font-size:11px}
  .count{color:#657089;font-size:11px}
  ul{list-style:none;margin:0;padding-left:16px;border-left:1px dashed #222836}
  ul.root{padding-left:0;border-left:0}
  li{margin:0}

  #side h2{font-size:14px;margin:0 0 2px}
  #side .type{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
  #side h3{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px;font-weight:600}
  #side p{margin:0 0 6px;color:#ccd3e0;font-size:13px}
  #side a{color:var(--accent);word-break:break-all}
  .empty{color:var(--dim);font-size:13px}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--dim);padding:8px 18px;border-bottom:1px solid var(--line)}
  .legend span{display:flex;align-items:center;gap:5px}
  .jump{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:0;text-align:left}
  .jump:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
  <h1>BRAIN BBQS / knowledge graph</h1>
  <span class="stats" id="stats">loading…</span>
  <span class="spacer"></span>
  <input type="search" id="q" placeholder="filter… (name, type, value)" />
  <button class="tool" id="expand">expand all</button>
  <button class="tool" id="collapse">collapse</button>
</header>
<div class="legend" id="legend"></div>
<main>
  <div id="tree"><p class="empty">Reading knowledge-graph.ttl…</p></div>
  <aside id="side"><p class="empty">Select an item in the tree to see its details.</p></aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/n3@1/browser/n3.min.js"></script>
<script>
const TTL_FILE = "knowledge-graph.ttl";
const RDF_TYPE = "http://www.w3.org/1999/02/22-rdf-syntax-ns#type";
const TYPE_ORDER = ["Consortium","WorkingGroup","Project","MonetaryGrant","Person","Product","Announcement","Event"];
const TYPE_LABELS = {Consortium:"consortium",WorkingGroup:"working group",Project:"project",MonetaryGrant:"grant",Person:"person",Product:"product",Announcement:"announcement",Event:"event",Other:"item"};
const PREDICATE_WORDS = {
  parentOrganization:"is part of", affiliation:"is affiliated with", funder:"is funded by",
  sameAs:"also appears at", contactPoint:"can be contacted at", funding:"has funding from",
  fundedItem:"funds", isPartOf:"is part of", hiringOrganization:"is hiring through",
  organizer:"is organized by", eventAttendanceMode:"attendance mode", eventStatus:"event status",
  manufacturer:"is made by", codeRepository:"code at", license:"license", url:"website",
  identifier:"identifier", keywords:"keywords", startDate:"starts", endDate:"ends",
  datePublished:"published", datePosted:"posted", validThrough:"valid through",
  jobTitle:"role", givenName:"given name", familyName:"family name", description:"description",
  softwareVersion:"version", programmingLanguage:"language", applicationCategory:"category",
  measurementTechnique:"measurement technique", variableMeasured:"measures", location:"location",
  foundingDate:"founded", headline:"headline", employmentType:"employment type", name:"name"
};
const CHILD_PREDICATES = ["parentOrganization","affiliation","isPartOf","funding","memberOf","subOrganization"];

const AMP = String.fromCharCode(38), LT = String.fromCharCode(60), GT = String.fromCharCode(62), QT = String.fromCharCode(34);
const ENT = {}; ENT[38]=AMP+"amp;"; ENT[60]=AMP+"lt;"; ENT[62]=AMP+"gt;"; ENT[34]=AMP+"quot;";
const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ENT[c.charCodeAt(0)]);
const $ = id => document.getElementById(id);
const isUrl = v => /^https?:\/\//.test(String(v)) || /^mailto:/.test(String(v));

function localName(iri){
  if(!iri) return "";
  if(String(iri).startsWith("mailto:")) return iri;
  try{ const u = new URL(iri); return decodeURIComponent((u.hash||u.pathname).split(/[\/#]/).filter(Boolean).pop()||iri); }
  catch(_){ const m = String(iri).match(/[#\/:]([^#\/:]+)$/); return m ? decodeURIComponent(m[1]) : iri; }
}
const predicateKey = iri => localName(iri).replace(/^schema:/,"");
function labelPredicate(k){ return PREDICATE_WORDS[k] || k.replace(/([a-z])([A-Z])/g,"$1 $2").toLowerCase(); }
function primaryType(types){ const n = types.map(localName); return TYPE_ORDER.find(t=>n.includes(t)) || "Other"; }

const state = { data:null, query:"", selectedId:null, open:new Set() };

async function loadGraph(){
  const res = await fetch(TTL_FILE);
  if(!res.ok) throw new Error("Could not load " + TTL_FILE + " (" + res.status + ")");
  const quads = new N3.Parser().parse(await res.text());
  const nodes = new Map(); const links = [];
  const get = id => { if(!nodes.has(id)) nodes.set(id,{id,label:localName(id),type:"Other",types:[],props:[],incoming:[],outgoing:[]}); return nodes.get(id); };
  for(const q of quads){
    const s = q.subject.value, p = q.predicate.value, o = q.object;
    const sn = get(s);
    if(p === RDF_TYPE){ sn.types.push(o.value); continue; }
    const key = predicateKey(p), label = labelPredicate(key);
    if(o.termType === "Literal"){
      if((key === "name" || key === "headline" || p.endsWith("#label")) && sn.label === localName(s)) sn.label = o.value;
      sn.props.push({key,label,value:o.value,isLink:false,id:null});
    } else {
      const on = get(o.value);
      sn.props.push({key,label,value:o.value,isLink:true,id:o.value});
      const link = {source:s,target:o.value,key,label};
      links.push(link); sn.outgoing.push(link); on.incoming.push(link);
    }
  }
  for(const n of nodes.values()) n.type = primaryType(n.types);
  return {nodes:[...nodes.values()], links, nodeById:nodes};
}

/* ---- build a directory-style hierarchy ---- */
function buildTree(data){
  const childrenOf = new Map(); const hasParent = new Set();
  const addChild = (parent,child) => { if(!childrenOf.has(parent)) childrenOf.set(parent,[]); childrenOf.get(parent).push(child); };
  const top = data.nodes.find(n => n.type === "Consortium")
    || [...data.nodes].sort((a,b)=>(b.incoming.length+b.outgoing.length)-(a.incoming.length+a.outgoing.length))[0];
  const topId = top ? top.id : null;
  for(const l of data.links){
    if(!CHILD_PREDICATES.includes(l.key)) continue;
    if(!data.nodeById.get(l.source) || !data.nodeById.get(l.target)) continue;
    if(hasParent.has(l.source) || l.source === topId) continue;
    addChild(l.target, l.source); hasParent.add(l.source);
  }

  // fundedItem: grant funds a project -> project nests under grant only if unparented
  for(const l of data.links){
    if(l.key !== "fundedItem" || hasParent.has(l.target) || l.target === topId) continue;

    addChild(l.source, l.target); hasParent.add(l.target);
  }
  const roots = data.nodes.filter(n => !hasParent.has(n.id) && (n.props.length || childrenOf.has(n.id)));
  const rank = n => TYPE_ORDER.indexOf(n.type) === -1 ? 99 : TYPE_ORDER.indexOf(n.type);
  const sortIds = ids => ids.map(id=>data.nodeById.get(id)).sort((a,b)=> rank(a)-rank(b) || a.label.localeCompare(b.label));
  roots.sort((a,b)=> rank(a)-rank(b) || a.label.localeCompare(b.label));
  return {roots, childrenOf, sortIds};
}

function searchable(n){
  return [n.label,n.type,n.id,...n.types.map(localName),...n.props.flatMap(p=>[p.label,p.value])].join(" ").toLowerCase();
}
function matches(n){ return !state.query || searchable(n).includes(state.query); }

let TREE = null;
function subtreeMatches(id, seen){
  seen = seen || new Set(); if(seen.has(id)) return false; seen.add(id);
  const n = state.data.nodeById.get(id);
  if(n && matches(n)) return true;
  return (TREE.childrenOf.get(id)||[]).some(c => subtreeMatches(c, seen));
}

function renderTree(){
  const ul = document.createElement("ul"); ul.className = "root";
  for(const r of TREE.roots) { const li = renderNode(r.id, new Set()); if(li) ul.appendChild(li); }
  const host = $("tree"); host.innerHTML = ""; host.appendChild(ul);
  if(!ul.children.length) host.innerHTML = '<p class="empty">No items match that filter.</p>';
}

function renderNode(id, ancestors){
  if(ancestors.has(id)) return null;
  const n = state.data.nodeById.get(id); if(!n) return null;
  if(state.query && !subtreeMatches(id)) return null;
  const kids = TREE.sortIds((TREE.childrenOf.get(id)||[]).filter(c=>!ancestors.has(c)));
  const isOpen = state.query ? true : state.open.has(id);
  const li = document.createElement("li");
  const row = document.createElement("div");
  row.className = "row" + (state.selectedId === id ? " sel" : "") + (state.query && matches(n) ? " hit" : "") + (state.query && !matches(n) ? " faded" : "");
  row.innerHTML =
    '<span class="twisty">' + (kids.length ? (isOpen ? "▾" : "▸") : "") + '</span>' +
    '<span class="dot" style="background:var(--' + n.type + ')"></span>' +
    '<span class="name">' + esc(n.label) + '</span>' +
    '<span class="kind">' + esc(TYPE_LABELS[n.type] || n.type) + '</span>' +
    (kids.length ? '<span class="count">(' + kids.length + ')</span>' : "");
  row.addEventListener("click", e => {
    if(kids.length && e.target.classList.contains("twisty")){ toggle(id); return; }
    select(id);
    if(kids.length) toggle(id);
  });
  li.appendChild(row);
  if(kids.length && isOpen){
    const sub = document.createElement("ul");
    const nextAncestors = new Set(ancestors); nextAncestors.add(id);
    for(const k of kids){ const kl = renderNode(k.id, nextAncestors); if(kl) sub.appendChild(kl); }
    if(sub.children.length) li.appendChild(sub);
  }
  return li;
}

function toggle(id){ state.open.has(id) ? state.open.delete(id) : state.open.add(id); renderTree(); }
function select(id){ state.selectedId = id; renderDetails(id); renderTree(); }

function renderDetails(id){
  const n = state.data.nodeById.get(id);
  const side = $("side"); if(!n){ side.innerHTML = '<p class="empty">Nothing selected.</p>'; return; }
  const lines = [];
  lines.push('<h2>' + esc(n.label) + '</h2>');
  lines.push('<div class="type">' + esc(TYPE_LABELS[n.type] || n.type) + '</div>');
  const desc = n.props.find(p => p.key === "description");
  if(desc) lines.push('<p>' + esc(desc.value) + '</p>');

  const facts = n.props.filter(p => !p.isLink && p.key !== "description" && p.key !== "name");
  if(facts.length){
    lines.push('<h3>details</h3>');
    for(const f of facts) lines.push('<p><span class="kind">' + esc(f.label) + ':</span> ' + esc(f.value) + '</p>');
  }
  const out = n.outgoing;
  if(out.length){
    lines.push('<h3>connects to</h3>');
    for(const l of out){
      const t = state.data.nodeById.get(l.target);
      const known = t && t.props.length;
      const text = esc(l.label) + " " + esc(t ? t.label : localName(l.target));
      lines.push('<p>' + (known ? '<button class="jump" data-go="' + esc(l.target) + '">' + text + '</button>'
        : (isUrl(l.target) ? '<a href="' + esc(l.target) + '" target="_blank" rel="noopener">' + text + '</a>' : text)) + '</p>');
    }
  }
  const inc = n.incoming;
  if(inc.length){
    lines.push('<h3>referenced by</h3>');
    for(const l of inc){
      const s = state.data.nodeById.get(l.source);
      lines.push('<p><button class="jump" data-go="' + esc(l.source) + '">' + esc(s ? s.label : localName(l.source)) + ' &' + 'mdash; ' + esc(l.label) + '</button></p>');
    }
  }
  side.innerHTML = lines.join("");
  side.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    const target = b.getAttribute("data-go");
    let cur = target;
    for(let i=0;i<20;i++){ const parent = parentOf(cur); if(!parent) break; state.open.add(parent); cur = parent; }
    select(target);
    const el = document.querySelector(".row.sel"); if(el) el.scrollIntoView({block:"center",behavior:"smooth"});
  }));
}

function parentOf(id){
  for(const [p,kids] of TREE.childrenOf) if(kids.includes(id)) return p;
  return null;
}

function renderLegend(){
  $("legend").innerHTML = TYPE_ORDER.map(t =>
    '<span><i class="dot" style="background:var(--' + t + ')"></i>' + esc(TYPE_LABELS[t]) + '</span>').join("");
}

function allIds(){ return [...TREE.childrenOf.keys()]; }

(async function init(){
  try{
    state.data = await loadGraph();
    TREE = buildTree(state.data);
    $("stats").textContent = state.data.nodes.length + " items · " + state.data.links.length + " connections";
    renderLegend();
    TREE.roots.forEach(r => state.open.add(r.id));
    (TREE.childrenOf.get(TREE.roots[0] && TREE.roots[0].id) || []).forEach(c => state.open.add(c));
    renderTree();
  }catch(err){
    $("tree").innerHTML = '<p class="empty">' + esc(err.message) + '</p>';
  }
})();

$("q").addEventListener("input", e => { state.query = e.target.value.trim().toLowerCase(); renderTree(); });
$("expand").addEventListener("click", () => { allIds().forEach(id => state.open.add(id)); renderTree(); });
$("collapse").addEventListener("click", () => { state.open.clear(); TREE.roots.forEach(r=>state.open.add(r.id)); renderTree(); });
</script>
</body>
</html>
