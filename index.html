<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BRAIN BBQS Knowledge Graph</title>
<meta name="description" content="Interactive visualization of the BRAIN BBQS consortium knowledge graph." />
<style>
  :root {
    --bg: #fafaf7;
    --ink: #1c1e26;
    --muted: #6b7080;
    --line: #d9d9d3;
    --panel: #ffffff;
    --accent: #b3541e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; font-weight: 650; letter-spacing: 0.2px; }
  header .sub { font-size: 12px; color: var(--muted); }
  #search {
    margin-left: auto;
    padding: 6px 10px;
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    min-width: 220px;
    color: var(--ink);
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #legend {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    padding: 8px 16px;
    font-size: 11.5px;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  #legend .chip { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; padding: 2px 6px; border-radius: 6px; }
  #legend .chip:hover { background: var(--bg); }
  #legend .chip.off { opacity: 0.35; text-decoration: line-through; }
  #legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #stage { position: relative; flex: 1; }
  svg { display: block; width: 100%; height: 100%; }
  .link { stroke: var(--line); stroke-width: 1.2px; }
  .link-label { font-size: 8.5px; fill: var(--muted); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 2.5px; }
  .node { cursor: pointer; }
  .node circle { stroke: var(--panel); stroke-width: 1.5px; }
  .node text { font-size: 10.5px; fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .node.dim, .link.dim, .link-label.dim { opacity: 0.12; }
  #details {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 300px;
    max-width: calc(100vw - 24px);
    max-height: calc(100% - 24px);
    overflow: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 12.5px;
    box-shadow: 0 8px 28px rgba(28, 30, 38, 0.1);
    display: none;
  }
  #details.open { display: block; }
  #details h2 { font-size: 14px; margin-bottom: 2px; }
  #details .type { font-size: 11px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; }
  #details dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
  #details dt { color: var(--muted); font-weight: 600; white-space: nowrap; }
  #details dd { word-break: break-word; }
  #details a { color: var(--accent); }
  #details button {
    position: absolute; top: 8px; right: 10px;
    border: none; background: none; font-size: 16px; cursor: pointer; color: var(--muted);
  }
  #status { padding: 24px; font-size: 13px; color: var(--muted); }
  #hint { position: absolute; left: 14px; bottom: 10px; font-size: 11px; color: var(--muted); pointer-events: none; }
</style>
</head>
<body>
  <header>
    <h1>BRAIN BBQS Knowledge Graph</h1>
    <span class="sub" id="stats"></span>
    <input id="search" type="search" placeholder="Search nodes… (e.g. pose, event, grant)" />
  </header>
  <div id="legend"></div>
  <div id="stage">
    <div id="status">Loading knowledge-graph.ttl…</div>
    <div id="details"><button id="close-details" title="Close">×</button><div id="details-body"></div></div>
    <div id="hint">Drag nodes to rearrange · scroll to zoom · click a node for details · click legend to filter</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/n3@1/browser/n3.min.js"></script>
<script>
const TTL_FILE = "knowledge-graph.ttl";

const TYPE_COLORS = {
  "Consortium":    "#b3541e",
  "WorkingGroup":  "#3a6ea5",
  "Person":        "#4f8a5b",
  "Project":       "#8a5fa3",
  "MonetaryGrant": "#c9a227",
  "Announcement":  "#d1603d",
  "Event":         "#2f9c95",
  "Product":       "#64748b",
  "Other":         "#a8a29e",
};
const NODE_RADIUS = { "Consortium": 16, "WorkingGroup": 11, "Project": 10, "Person": 7, "Event": 8, "Product": 8, "MonetaryGrant": 9, "Announcement": 8, "Other": 6 };
const HIDDEN_PREDICATES = new Set(["http://www.w3.org/1999/02/22-rdf-syntax-ns#type"]);

function localName(iri) {
  if (!iri) return "";
  const m = iri.match(/[#\/]([^#\/]+)$/);
  return m ? m[1] : iri;
}
function shortPred(iri) {
  const n = localName(iri);
  return n.replace(/([a-z])([A-Z])/g, "$1 $2");
}
function pickType(types) {
  for (const t of types) {
    const n = localName(t);
    if (TYPE_COLORS[n]) return n;
  }
  return "Other";
}

async function main() {
  const res = await fetch(TTL_FILE);
  if (!res.ok) throw new Error("Could not load " + TTL_FILE + " (" + res.status + ")");
  const text = await res.text();
  const quads = new N3.Parser().parse(text);

  const nodes = new Map();
  const links = [];
  const seen = new Set();

  function node(id) {
    if (!nodes.has(id)) nodes.set(id, { id, label: localName(id), type: "Other", types: [], props: [] });
    return nodes.get(id);
  }

  for (const q of quads) {
    const s = q.subject.value, p = q.predicate.value, o = q.object;
    if (HIDDEN_PREDICATES.has(p)) {
      node(s).types.push(o.value);
      continue;
    }
    if (o.termType === "Literal") {
      const n = node(s);
      if (p.endsWith("#name") || p.endsWith("/name") || p.endsWith("name") || p === "http://www.w3.org/2000/01/rdf-schema#label") {
        if (n.label === localName(s)) n.label = o.value;
      }
      n.props.push([shortPred(p), o.value, false]);
    } else {
      const key = s + "|" + p + "|" + o.value;
      if (!seen.has(key)) {
        seen.add(key);
        links.push({ source: s, target: o.value, label: shortPred(p) });
        node(s); node(o.value);
      }
      node(s).props.push([shortPred(p), localName(o.value), true, o.value]);
    }
  }

  for (const n of nodes.values()) n.type = pickType(n.types);
  const data = { nodes: [...nodes.values()], links };
  document.getElementById("stats").textContent = data.nodes.length + " nodes · " + data.links.length + " links";
  render(data);
}

function render(data) {
  document.getElementById("status").remove();
  const stage = document.getElementById("stage");
  const svg = d3.select(stage).append("svg");
  const g = svg.append("g");

  svg.call(d3.zoom().scaleExtent([0.2, 5]).on("zoom", e => g.attr("transform", e.transform)));

  const link = g.append("g").selectAll("line").data(data.links).join("line").attr("class", "link");
  const linkLabel = g.append("g").selectAll("text").data(data.links).join("text")
    .attr("class", "link-label").attr("text-anchor", "middle").text(d => d.label);

  const node = g.append("g").selectAll("g").data(data.nodes).join("g")
    .attr("class", "node")
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  node.append("circle")
    .attr("r", d => NODE_RADIUS[d.type] || 7)
    .attr("fill", d => TYPE_COLORS[d.type] || TYPE_COLORS.Other);
  node.append("text").attr("dy", d => -(NODE_RADIUS[d.type] || 7) - 4).attr("text-anchor", "middle").text(d => d.label);

  const sim = d3.forceSimulation(data.nodes)
    .force("link", d3.forceLink(data.links).id(d => d.id).distance(90))
    .force("charge", d3.forceManyBody().strength(-320))
    .force("collide", d3.forceCollide(d => (NODE_RADIUS[d.type] || 7) + 16))
    .force("x", d3.forceX())
    .force("y", d3.forceY());

  function fit() {
    const w = stage.clientWidth, h = stage.clientHeight;
    svg.attr("viewBox", [-w / 2, -h / 2, w, h]);
  }
  fit();
  window.addEventListener("resize", fit);

  sim.on("tick", () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    linkLabel.attr("x", d => (d.source.x + d.target.x) / 2).attr("y", d => (d.source.y + d.target.y) / 2);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  // Details panel
  const details = document.getElementById("details");
  const body = document.getElementById("details-body");
  document.getElementById("close-details").onclick = () => {
    details.classList.remove("open");
    node.classed("dim", false); link.classed("dim", false); linkLabel.classed("dim", false);
  };
  node.on("click", (e, d) => {
    e.stopPropagation();
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const rows = d.props.map(([k, v, isLink, iri]) =>
      `<dt>${esc(k)}</dt><dd>${isLink ? `<a href="${esc(iri)}" target="_blank" rel="noopener">${esc(v)}</a>` : esc(v)}</dd>`).join("");
    body.innerHTML = `<div class="type">${d.type}</div><h2>${esc(d.label)}</h2>` +
      `<dl>${rows}</dl>` +
      `<p style="margin-top:10px;color:var(--muted);font-size:10.5px;word-break:break-all">${esc(d.id)}</p>`;
    details.classList.add("open");
    // Highlight neighborhood
    const nb = new Set([d.id]);
    data.links.forEach(l => {
      if (l.source.id === d.id) nb.add(l.target.id);
      if (l.target.id === d.id) nb.add(l.source.id);
    });
    node.classed("dim", n => !nb.has(n.id));
    link.classed("dim", l => l.source.id !== d.id && l.target.id !== d.id);
    linkLabel.classed("dim", l => l.source.id !== d.id && l.target.id !== d.id);
  });
  svg.on("click", () => document.getElementById("close-details").click());

  // Legend with type filter
  const legend = document.getElementById("legend");
  const active = new Set(Object.keys(TYPE_COLORS));
  for (const [type, color] of Object.entries(TYPE_COLORS)) {
    if (type === "Other") continue;
    if (!data.nodes.some(n => n.type === type)) continue;
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `<span class="dot" style="background:${color}"></span>${type}`;
    chip.onclick = () => {
      active.has(type) ? active.delete(type) : active.add(type);
      chip.classList.toggle("off", !active.has(type));
      node.classed("dim", n => !active.has(n.type) && n.type !== "Consortium");
      link.classed("dim", l => !active.has(l.source.type) || !active.has(l.target.type));
      linkLabel.classed("dim", l => !active.has(l.source.type) || !active.has(l.target.type));
    };
    legend.appendChild(chip);
  }

  // Search
  const search = document.getElementById("search");
  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    if (!q) { node.classed("dim", false); link.classed("dim", false); linkLabel.classed("dim", false); return; }
    const match = new Set(data.nodes.filter(n => (n.label + " " + n.type).toLowerCase().includes(q)).map(n => n.id));
    node.classed("dim", n => !match.has(n.id));
    link.classed("dim", l => !match.has(l.source.id) && !match.has(l.target.id));
    linkLabel.classed("dim", l => !match.has(l.source.id) && !match.has(l.target.id));
  });
}

main().catch(err => {
  document.getElementById("status").textContent = "Error: " + err.message +
    " — make sure knowledge-graph.ttl sits next to this index.html in the repo.";
});
</script>
</body>
</html>
