<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BRAIN BBQS</title>
<style>
  body { margin: 0; background: #0d1117; overflow: hidden; }
  svg  { width: 100vw; height: 100vh; }
  text { font: 11px sans-serif; fill: #e6edf3; pointer-events: none; }
  #tip {
    position: fixed; background: #161b22; border: 1px solid #30363d;
    border-radius: 6px; padding: 6px 10px; font: 12px sans-serif;
    color: #e6edf3; pointer-events: none; opacity: 0; transition: opacity .1s;
  }
</style>
</head>
<body>
<svg><g id="g"></g></svg>
<div id="tip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/n3@1.22.3/browser/n3.min.js"></script>
<script>
const TTL = `
@prefix rdf:    <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
@prefix schema: <https://schema.org/> .
@prefix ex:     <https://brain-bbqs.org/vocab/> .
@prefix bbqs:   <https://brain-bbqs.org/> .

bbqs:BBQS a ex:Consortium ;
    schema:name "BRAIN BBQS" .

bbqs:wg-analytics a ex:WorkingGroup ;
    schema:name "WG-Analytics" ;
    schema:parentOrganization bbqs:BBQS .

bbqs:wg-devices a ex:WorkingGroup ;
    schema:name "WG-Devices" ;
    schema:parentOrganization bbqs:BBQS .

bbqs:wg-elsi a ex:WorkingGroup ;
    schema:name "WG-ELSI" ;
    schema:parentOrganization bbqs:BBQS .

bbqs:wg-standards a ex:WorkingGroup ;
    schema:name "WG-Standards" ;
    schema:parentOrganization bbqs:BBQS .

bbqs:project-species a ex:Project ;
    schema:name "Species Comparison" ;
    schema:parentOrganization bbqs:BBQS .

bbqs:project-marr a ex:Project ;
    schema:name "BBQS-Marr Object" ;
    schema:parentOrganization bbqs:BBQS .

bbqs:project-grants a ex:Project ;
    schema:name "Grant Metadata" ;
    schema:parentOrganization bbqs:BBQS .

bbqs:ann-funding-1 a ex:Announcement ;
    schema:name "NIH BRAIN Funding Call" ;
    schema:isPartOf bbqs:BBQS .

bbqs:ann-job-1 a ex:Announcement ;
    schema:name "Postdoc Opening" ;
    schema:isPartOf bbqs:BBQS .

bbqs:ann-news-1 a ex:Announcement ;
    schema:name "Year-Two Progress Report" ;
    schema:isPartOf bbqs:BBQS .

bbqs:event-annual-2026 a schema:Event ;
    schema:name "Annual Meeting 2026" ;
    schema:isPartOf bbqs:BBQS .

bbqs:event-hackathon-2026 a schema:Event ;
    schema:name "Data Hackathon 2026" ;
    schema:isPartOf bbqs:BBQS .

bbqs:prod-openfield a ex:Product ;
    schema:name "OpenField Tracker" ;
    schema:isPartOf bbqs:wg-standards .

bbqs:prod-arena a ex:Product ;
    schema:name "Standardized Arena Kit" ;
    schema:isPartOf bbqs:wg-devices .

bbqs:prod-pose-model a ex:Product ;
    schema:name "BBQS Pose Model v1" ;
    schema:isPartOf bbqs:wg-analytics .

bbqs:prod-behavior-algo a ex:Product ;
    schema:name "Behavior Segmentation Algorithm" ;
    schema:isPartOf bbqs:wg-analytics .

bbqs:prod-rodent-dataset a ex:Product ;
    schema:name "Rodent Behavior Dataset 2025" ;
    schema:isPartOf bbqs:project-species .

bbqs:person-kristofer-bouchard a schema:Person ;
    schema:name "Kristofer Bouchard" ;
    schema:affiliation bbqs:wg-analytics .

bbqs:person-han-yi a schema:Person ;
    schema:name "Han Yi" ;
    schema:affiliation bbqs:wg-analytics .

bbqs:person-alireza-kazemi a schema:Person ;
    schema:name "Alireza Kazemi" ;
    schema:affiliation bbqs:wg-devices .

bbqs:person-uros-topalovic a schema:Person ;
    schema:name "Uros Topalovic" ;
    schema:affiliation bbqs:wg-devices .

bbqs:person-laura-cabrera a schema:Person ;
    schema:name "Laura Cabrera" ;
    schema:affiliation bbqs:wg-elsi .

bbqs:person-oliver-ruebel a schema:Person ;
    schema:name "Oliver Ruebel" ;
    schema:affiliation bbqs:wg-standards .

bbqs:person-melissa-kline-struhl a schema:Person ;
    schema:name "Melissa Kline Struhl" ;
    schema:affiliation bbqs:wg-standards .
`;

const COLORS = {
  'https://brain-bbqs.org/vocab/Consortium':   '#f0c040',
  'https://brain-bbqs.org/vocab/Project':      '#58a6ff',
  'https://brain-bbqs.org/vocab/WorkingGroup': '#f0883e',
  'https://brain-bbqs.org/vocab/Announcement': '#ff7b72',
  'https://brain-bbqs.org/vocab/Product':      '#d2a8ff',
  'https://schema.org/Event':                  '#3fb950',
  'https://schema.org/Person':                 '#79c0ff',
};
const SIZE = { 'https://brain-bbqs.org/vocab/Consortium': 18 };
const RDF_TYPE    = 'http://www.w3.org/1999/02/22-rdf-syntax-ns#type';
const SCHEMA_NAME = 'https://schema.org/name';
const EDGE_PROPS  = new Set([
  'https://schema.org/parentOrganization',
  'https://schema.org/isPartOf',
  'https://schema.org/affiliation',
]);

function main() {
  const quads = [];
  new N3.Parser({ format: 'Turtle' }).parse(TTL, (e, q) => q && quads.push(q));

  const typeOf = {}, nameOf = {};
  for (const {subject:{value:s}, predicate:{value:p}, object:{value:o, termType}} of quads) {
    if (p === RDF_TYPE) typeOf[s] = o;
    if (p === SCHEMA_NAME && termType === 'Literal') nameOf[s] = o;
  }

  const nodes = Object.entries(typeOf)
    .filter(([,t]) => COLORS[t])
    .map(([id, type]) => ({ id, type, label: nameOf[id] || id.replace(/.*[/#]/, '') }));

  const nodeSet = new Set(nodes.map(n => n.id));
  const seen = new Set();
  const links = [];
  for (const {subject:{value:s}, predicate:{value:p}, object:{value:o}} of quads) {
    if (!EDGE_PROPS.has(p) || !nodeSet.has(s) || !nodeSet.has(o)) continue;
    const k = s + o;
    if (!seen.has(k)) { seen.add(k); links.push({ source: s, target: o }); }
  }

  const W = innerWidth, H = innerHeight;
  const svg = d3.select('svg');
  const g   = d3.select('#g');
  const tip = document.getElementById('tip');

  svg.call(d3.zoom().scaleExtent([.05, 8]).on('zoom', e => g.attr('transform', e.transform)))
     .call(d3.zoom().transform, d3.zoomIdentity.translate(W/2, H/2).scale(.8));

  const sim = d3.forceSimulation(nodes)
    .force('link',    d3.forceLink(links).id(d => d.id).distance(90).strength(.6))
    .force('charge',  d3.forceManyBody().strength(-300))
    .force('collide', d3.forceCollide(22))
    .force('x',       d3.forceX(0).strength(.04))
    .force('y',       d3.forceY(0).strength(.04));

  const link = g.selectAll('line').data(links).join('line')
    .attr('stroke', '#30363d').attr('stroke-opacity', .6);

  const node = g.selectAll('g.n').data(nodes, d => d.id).join('g').attr('class', 'n')
    .style('cursor', 'pointer')
    .on('mouseover', (ev, d) => { tip.style.opacity = 1; tip.textContent = d.label; })
    .on('mousemove', ev => { tip.style.left = (ev.clientX+12)+'px'; tip.style.top = (ev.clientY-8)+'px'; })
    .on('mouseout',  () => tip.style.opacity = 0)
    .call(d3.drag()
      .on('start', (ev,d) => { if (!ev.active) sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',  (ev,d) => { d.fx=ev.x; d.fy=ev.y; })
      .on('end',   (ev,d) => { if (!ev.active) sim.alphaTarget(0); d.fx=d.fy=null; }));

  node.append('circle')
    .attr('r',            d => SIZE[d.type] || 9)
    .attr('fill',         d => (COLORS[d.type] || '#8b949e') + '22')
    .attr('stroke',       d => COLORS[d.type] || '#8b949e')
    .attr('stroke-width', 1.5);

  node.append('text')
    .attr('dy', d => (SIZE[d.type] || 9) + 12)
    .attr('text-anchor', 'middle')
    .text(d => d.label);

  sim.on('tick', () => {
    link.attr('x1', d=>d.source.x).attr('y1', d=>d.source.y)
        .attr('x2', d=>d.target.x).attr('y2', d=>d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}
main();
</script>
</body>
</html>
