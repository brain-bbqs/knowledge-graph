name: Update Knowledge Graph

on:
  push:
    branches: [main]
    paths:
      - config.yaml
      - people.csv
      - publications.csv
      - generate_kg.py

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate kg.trig
        run: python3 generate_kg.py

      - name: Commit updated kg.trig
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kg.trig
          git diff --staged --quiet || git commit -m "chore: regenerate kg.trig from config.yaml [skip ci]"
          git push
